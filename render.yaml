databases:
  - name: lunch-db
    plan: free
    databaseName: lunch
    user: lunch

services:
  - type: web
    name: lunch-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase: { name: lunch-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: lunch-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: lunch-db, property: database }
      - key: DB_USER
        fromDatabase: { name: lunch-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: lunch-db, property: password }
      - key: FRONTEND_URL
        value: https://lunch.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MAP_PROVIDER
        value: none
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: NAVER_MAP_CLIENT_ID
        sync: false
      - key: NAVER_MAP_CLIENT_SECRET
        sync: false
