services:
  - type: web
    name: lunch-project-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: lunch
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: require
      - key: FRONTEND_URL
        value: https://lunch-project.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MAP_PROVIDER
        value: none
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: NAVER_MAP_CLIENT_ID
        sync: false
      - key: NAVER_MAP_CLIENT_SECRET
        sync: false
