services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lunch
      POSTGRES_USER: lunch
      POSTGRES_PASSWORD: lunch
    ports: ["5432:5432"]
    volumes: ["lunch-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunch"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  lunch-postgres:
