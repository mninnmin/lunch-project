server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: lunch-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lunch}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USER:lunch}
    password: ${DB_PASSWORD:lunch}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  auth:
    jwt-secret: ${JWT_SECRET:local-development-secret-change-before-production-2026}
    token-hours: 168
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  recommendation:
    provider: rules
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
  maps:
    provider: ${MAP_PROVIDER:none}
    kakao-key: ${KAKAO_REST_API_KEY:}
    naver-client-id: ${NAVER_MAP_CLIENT_ID:}
    naver-client-secret: ${NAVER_MAP_CLIENT_SECRET:}
